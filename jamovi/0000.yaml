  - name: Data Quality
    path: dataquality_test.omv
    description: Example dataset for the Data Quality analysis.
    tags:
      - Data Quality
  - name: Categorical Variables Report
    path: reportcat_test.omv
    description: Example dataset for the Categorical Variables Report analysis.
    tags:
      - Categorical Variables Report
  - name: Continuous Variables Summary
    path: summarydata_test.omv
    description: Example dataset for the Continuous Variables Summary analysis.
    tags:
      - Continuous Variables Summary
  - name: Treatment Response
    path: treatmentResponse.omv
    description: Example dataset for the Treatment Response analysis.
    tags:
      - Treatment Response
usesNative: true
minApp: 2.7.27

