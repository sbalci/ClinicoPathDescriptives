  - name: Benford Analysis
    path: benford_test.omv
    description: Example dataset for the Benford Analysis analysis.
    tags:
      - Benford Analysis
  - name: Data Quality Check
    path: checkdata_test.omv
    description: Example dataset for the Data Quality Check analysis.
    tags:
